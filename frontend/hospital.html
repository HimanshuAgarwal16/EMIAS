<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMIAS - Hospital Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #eaf4ff;
            background:
                radial-gradient(circle at 15% 15%, rgba(32, 119, 255, .18), transparent 32%),
                radial-gradient(circle at 85% 80%, rgba(112, 77, 255, .14), transparent 30%),
                #061426;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
        }
        .page { width: 100%; max-width: 520px; }
        .brand { text-align: center; margin-bottom: 26px; }
        .brand-mark {
            width: 58px; height: 58px; margin: 0 auto 12px;
            border: 1px solid rgba(89, 205, 255, .45);
            border-radius: 17px;
            display: grid; place-items: center;
            background: rgba(10, 34, 62, .8);
            box-shadow: 0 0 35px rgba(48, 180, 255, .12);
        }
        .brand-mark svg { width: 36px; height: 36px; }
        .brand h1 { font-size: 29px; letter-spacing: .08em; }
        .brand p { margin-top: 6px; color: #91a8c2; font-size: 13px; }
        .eyebrow {
            text-align: center; color: #64d7ff; font-size: 11px;
            letter-spacing: .18em; font-weight: 700; margin-bottom: 10px;
        }
        .card {
            background: rgba(11, 30, 52, .88);
            border: 1px solid rgba(122, 174, 216, .18);
            border-radius: 22px;
            padding: 34px;
            box-shadow: 0 24px 70px rgba(0,0,0,.35);
            backdrop-filter: blur(18px);
        }
        h2 { text-align: center; font-size: 25px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #93aac2; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #cbd9e8; font-size: 13px; font-weight: 700; }
        input {
            width: 100%; padding: 14px 15px; border-radius: 11px;
            border: 1px solid #28445f; background: #081b30; color: #f2f8ff;
            outline: none; font-size: 15px; transition: .2s;
        }
        input::placeholder { color: #607992; }
        input:focus { border-color: #39c6ff; box-shadow: 0 0 0 3px rgba(57,198,255,.10); }
        .login-btn {
            width: 100%; border: 0; border-radius: 11px; padding: 14px;
            margin-top: 5px; cursor: pointer; color: #031321; font-size: 15px;
            font-weight: 800; background: linear-gradient(135deg, #58d7ff, #5c9dff);
            transition: transform .2s, box-shadow .2s;
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(59,173,255,.20); }
        .message { display: none; margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 13px; }
        .error { background: rgba(239,68,68,.12); color: #ffb5b5; border: 1px solid rgba(239,68,68,.25); }
        .success { background: rgba(34,197,94,.12); color: #a7efc1; border: 1px solid rgba(34,197,94,.25); }
        .register { text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(122,174,216,.13); color: #879eb7; font-size: 13px; }
        .register a, .back-link { color: #62d5ff; text-decoration: none; font-weight: 700; }
        .register a:hover, .back-link:hover { text-decoration: underline; }
        .back-link { display: block; text-align: center; margin-top: 22px; font-size: 13px; }
        .security { text-align: center; margin-top: 18px; color: #6f879f; font-size: 11px; letter-spacing: .03em; }
        @media (max-width: 560px) { body { padding: 18px; } .card { padding: 26px 20px; } }
    </style>
</head>
<body>
<div class="page">
    <div class="brand">
        <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 34h11l5-14 9 28 7-19 5 5h11" stroke="#5bd8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M32 7v10M27 12h10" stroke="#7b9dff" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="eyebrow">SECURE HEALTHCARE ACCESS</div>
        <h1>EMIAS</h1>
        <p>Emergency Medical Information &amp; Assistance System</p>
    </div>

    <div class="card">
        <h2>Hospital Portal</h2>
        <p class="subtitle">Sign in to securely access authorized patient information.</p>

        <form onsubmit="hospitalLogin(event)">
            <div class="form-group">
                <label for="email">Hospital Email</label>
                <input type="email" id="email" placeholder="Enter hospital email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-btn">Sign In to Hospital Portal</button>
        </form>

        <div id="message" class="message"></div>

        <div class="register">
            New hospital? <a href="/frontend/hospital_register.html">Register your hospital</a>
        </div>
    </div>

    <a href="/" class="back-link">← Back to Home</a>
    <div class="security">Protected access for authorized hospital users</div>
</div>

<script>
async function hospitalLogin(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    const formData = new URLSearchParams();
    formData.append("username", email);
    formData.append("password", password);

    try {
        const response = await fetch("/auth/hospital/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            message.innerText = data.detail || "Invalid email or password.";
            message.className = "message error";
            message.style.display = "block";
            return;
        }

        localStorage.setItem("hospital_token", data.access_token);
        message.innerText = "Login successful. Redirecting...";
        message.className = "message success";
        message.style.display = "block";

        setTimeout(() => {
            window.location.href = "/frontend/hospital_dashboard.html";
        }, 500);
    } catch (error) {
        console.error(error);
        message.innerText = "Unable to connect to EMIAS server.";
        message.className = "message error";
        message.style.display = "block";
    }
}
</script>
</body>
</html>
